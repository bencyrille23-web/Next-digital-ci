<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commander — Next Digital CI</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a class="brand" href="/">NEXT <span>DIGITAL CI</span></a></header><main class="formwrap"><h1>Passer une commande</h1>
<form id="form"><label>Nom complet<input name="name" required></label><label>WhatsApp / Téléphone<input name="phone" required></label><label>E-mail (facultatif)<input name="email" type="email"></label><label>Produit<select name="productId" id="product" required></select></label><label>Moyen de paiement<select name="paymentMethod"><option>Wave</option><option>Orange Money</option><option>MTN MoMo</option><option>Moov Money</option><option>Autre</option></select></label><label>Note (facultatif)<textarea name="note"></textarea></label><button class="btn big">Valider la commande</button></form><p id="msg"></p></main>
<script>
const select=document.getElementById('product');
fetch('/api/products').then(r=>r.json()).then(ps=>{
 select.innerHTML=ps.map(p=>`<option value="${p.id}">${p.name} — ${p.duration} — ${p.price.toLocaleString('fr-FR')} F CFA</option>`).join('');
 const id=new URLSearchParams(location.search).get('product'); if(id) select.value=id;
});
document.getElementById('form').onsubmit=async e=>{
 e.preventDefault(); const data=Object.fromEntries(new FormData(e.target));
 const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const j=await r.json(); if(!r.ok) return document.getElementById('msg').textContent=j.error||'Erreur';
 location.href='/confirmation.html?ref='+encodeURIComponent(j.order.ref);
};
</script></body></html>
