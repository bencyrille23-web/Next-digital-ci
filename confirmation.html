<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commande confirmée — Next Digital CI</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/"><span class="brand-mark">N</span><span>NEXT <b>DIGITAL CI</b></span></a></header><main class="confirm"><div class="confirm-card"><div class="success">✓</div><div class="eyebrow">COMMANDE ENREGISTRÉE</div><h1>Merci pour votre commande.</h1><p>Votre demande a bien été enregistrée. Gardez votre référence pour le suivi.</p><div id="details" class="confirm-details">Chargement…</div><div class="confirm-actions"><a id="wa" class="primary" href="#">Contacter WhatsApp</a><a class="secondary" href="/">Retour à l'accueil</a></div></div></main><script>
(async()=>{const ref=new URLSearchParams(location.search).get('ref');if(!ref)return;const r=await fetch('/api/orders/'+encodeURIComponent(ref));if(!r.ok)return;const o=await r.json();document.querySelector('#details').innerHTML=`<div><span>Référence</span><b>${o.ref}</b></div><div><span>Offre</span><b>${o.product}</b></div><div><span>Montant</span><b>${o.amount.toLocaleString('fr-FR')} F CFA</b></div><div><span>Statut</span><b>${o.status}</b></div>`;const c=await fetch('/api/config').then(x=>x.json());const n=(c.whatsapp||'').replace(/\D/g,'');const text=encodeURIComponent(`Bonjour Next Digital CI, je viens de passer la commande ${o.ref}.\nProduit : ${o.product}\nMontant : ${o.amount.toLocaleString('fr-FR')} F CFA\nNom : ${o.customer_name}\nTéléphone : ${o.customer_phone}`);if(n)document.querySelector('#wa').href=`https://wa.me/${n}?text=${text}`;else document.querySelector('#wa').style.display='none';})();
</script></body></html>
