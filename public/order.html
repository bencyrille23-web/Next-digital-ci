<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commander — Next Digital CI</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="nav"><a href="/" class="brand">NEXT <span>DIGITAL CI</span></a></header>
<main class="formwrap"><div class="panel"><h1>Passer une commande</h1><p class="muted">Choisissez votre offre puis renseignez vos coordonnées.</p>
<form id="orderForm">
<label>Nom complet<input id="name" required></label>
<label>WhatsApp / téléphone<input id="phone" required placeholder="07 XX XX XX XX"></label>
<label>Email (facultatif)<input id="email" type="email"></label>
<label>Offre<select id="product" required><option value="">Chargement...</option></select></label>
<div id="price" class="price"></div>
<button class="btn primary full" type="submit">Valider la commande</button>
<div id="msg"></div>
</form></div></main>
<script>
let products=[];
const select=document.querySelector('#product'), price=document.querySelector('#price');
const nameInput=document.querySelector('#name'), phoneInput=document.querySelector('#phone'), emailInput=document.querySelector('#email');

fetch('/api/products').then(r=>r.json()).then(data=>{
 products=data; select.innerHTML='<option value="">Choisir une offre</option>'+data.map(p=>`<option value="${p.id}">${p.service} — ${p.plan} — ${Number(p.amount).toLocaleString('fr-FR')} F</option>`).join('');
});
select.addEventListener('change',()=>{const p=products.find(x=>x.id===select.value);price.textContent=p?Number(p.amount).toLocaleString('fr-FR')+' F CFA':''});
document.querySelector('#orderForm').addEventListener('submit',async e=>{
 e.preventDefault(); document.querySelector('#msg').textContent='Envoi...';
 const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
 customer_name:nameInput.value,customer_phone:phoneInput.value,customer_email:emailInput.value,product_id:product.value})});

 const d=await r.json();
 if(!r.ok){document.querySelector('#msg').textContent=d.error||'Erreur';return}
 location.href='/confirmation.html?ref='+encodeURIComponent(d.ref);
});
</script></body></html>
