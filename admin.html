<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Next Digital CI</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/"><span class="brand-mark">N</span><span>NEXT <b>DIGITAL CI</b></span></a><a class="nav-btn" href="/">Site</a></header><main class="admin-page"><section><div class="eyebrow">ADMINISTRATION</div><h1>Tableau de bord</h1><div id="login" class="form-card admin-login"><input id="email" type="email" placeholder="E-mail administrateur"><input id="password" type="password" placeholder="Mot de passe"><button class="primary" onclick="login()">Connexion</button><p id="err" class="form-msg"></p></div><div id="dash" style="display:none"><div class="admin-bar"><span>Connecté : <b id="adminEmail"></b></span><button class="secondary" onclick="logout()">Déconnexion</button></div><div id="stats" class="stats"></div><div class="admin-tabs"><button class="filter active" onclick="showTab('orders',this)">Commandes</button><button class="filter" onclick="showTab('stock',this)">Stock des comptes</button></div><section id="ordersTab"><div class="table-wrap"><table><thead><tr><th>Commande</th><th>Client</th><th>Offre</th><th>Montant</th><th>Paiement</th><th>Livraison</th><th>Actions</th></tr></thead><tbody id="orders"></tbody></table></div></section><section id="stockTab" style="display:none"><div class="form-card"><h2>Ajouter un compte au stock</h2><p class="muted">Les identifiants sont chiffrés dans la base. Ne mets ici que des comptes que tu es autorisé à fournir.</p><div class="form-grid"><input id="svc" placeholder="Service (ex. Netflix)"><input id="plan" placeholder="Offre (ex. Premium)"><input id="ident" placeholder="E-mail / identifiant"><input id="secret" type="password" placeholder="Mot de passe / secret"><input id="start" type="datetime-local"><input id="expiry" type="datetime-local"><select id="astatus"><option>À tester</option><option>Fonctionnel</option><option>Désactivé</option></select><input id="anote" placeholder="Note (facultatif)"></div><button class="primary" onclick="addAccount()">Ajouter au stock</button><p id="stockMsg" class="form-msg"></p></div><div class="table-wrap"><table><thead><tr><th>Service</th><th>Offre</th><th>Identifiant</th><th>État</th><th>Expiration</th><th>Jours</th><th>Action</th></tr></thead><tbody id="accounts"></tbody></table></div></section></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur');return j}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});load()}catch(e){err.textContent=e.message}}
async function load(){const me=await fetch('/api/admin/me');if(!me.ok){loginBox();return}adminEmail.textContent=(await me.json()).email;login.style.display='none';dash.style.display='block';await Promise.all([loadStats(),loadOrders(),loadAccounts()])}
async function loadStats(){const s=await api('/api/admin/stats');stats.innerHTML=`<div><b>${s.orders}</b><span>Commandes</span></div><div><b>${s.pending}</b><span>Paiements à vérifier</span></div><div><b>${s.toDeliver}</b><span>À livrer</span></div><div><b>${s.stock}</b><span>Comptes disponibles</span></div><div><b>${s.expiring}</b><span>Expirent sous 7 j.</span></div><div><b>${s.revenue.toLocaleString('fr-FR')} F</b><span>CA payé</span></div>`}
async function loadOrders(){const rows=await api('/api/admin/orders');orders.innerHTML=rows.map(x=>`<tr><td><b>${esc(x.ref)}</b><small>${new Date(x.created_at).toLocaleString('fr-FR')}</small></td><td>${esc(x.customer_name)}<small>${esc(x.customer_phone)}</small></td><td>${esc(x.product)}</td><td>${Number(x.amount).toLocaleString('fr-FR')} F</td><td><b>${esc(x.payment_status||'À vérifier')}</b><small>${esc(x.payment_method)}</small></td><td>${esc(x.delivery_status||'À livrer')}</td><td class="actions">${x.payment_status!=='Payé'&&x.status!=='Annulée'?`<button class="small-btn" onclick="pay('${esc(x.ref)}')">✓ Confirmer paiement</button><button class="danger-btn" onclick="reject('${esc(x.ref)}')">Refuser</button>`:''}${x.payment_status==='Payé'&&x.delivery_status!=='Livrée'?`<button class="small-btn" onclick="assign('${esc(x.ref)}')">Attribuer un compte</button>`:''}${x.assigned_account_id&&x.delivery_status!=='Livrée'?`<button class="small-btn" onclick="credentials('${x.assigned_account_id}','${esc(x.ref)}','${esc(x.customer_name)}','${esc(x.customer_phone)}','${esc(x.product)}','${x.amount}')">WhatsApp / Identifiants</button><button class="small-btn" onclick="delivered('${esc(x.ref)}')">Marquer livrée</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">Aucune commande.</td></tr>'}
async function pay(ref){await api('/api/admin/orders/'+encodeURIComponent(ref)+'/confirm-payment',{method:'POST'});load()}
async function reject(ref){if(confirm('Refuser ce paiement et annuler la commande ?')){await api('/api/admin/orders/'+encodeURIComponent(ref)+'/reject-payment',{method:'POST'});load()}}
async function assign(ref){const a=await api('/api/admin/orders/'+encodeURIComponent(ref)+'/available-accounts');if(!a.length)return alert('Aucun compte fonctionnel et disponible pour cette commande.');const choice=prompt('Entre l’ID du compte à attribuer :\n'+a.map(x=>`#${x.id} — ${x.service} ${x.plan} — ${x.identifier} — ${x.days_left==null?'sans date':x.days_left+' j.'}`).join('\n'));if(choice) {await api('/api/admin/orders/'+encodeURIComponent(ref)+'/assign-account',{method:'POST',body:JSON.stringify({accountId:Number(choice)})});load()}}
async function credentials(id,ref,name,phone,product,amount){const a=await api('/api/admin/accounts/'+id+'/credentials');const msg=`Bonjour ${name} 👋\n\nVotre paiement de ${Number(amount).toLocaleString('fr-FR')} F CFA pour ${product} a bien été confirmé.\n\nVoici vos informations d'accès :\n📧 Identifiant : ${a.identifier}\n🔑 Mot de passe : ${a.secret}\n\nRéférence : ${ref}\n\nMerci pour votre confiance 🙏\nNext Digital CI — Le digital, simplement.`;const url='https://wa.me/'+String(phone).replace(/\D/g,'')+'?text='+encodeURIComponent(msg);window.open(url,'_blank')}
async function delivered(ref){await api('/api/admin/orders/'+encodeURIComponent(ref)+'/delivered',{method:'POST',body:JSON.stringify({})});load()}
async function loadAccounts(){const rows=await api('/api/admin/accounts');accounts.innerHTML=rows.map(x=>`<tr><td>${esc(x.service)}</td><td>${esc(x.plan)}</td><td>${esc(x.identifier)}</td><td><select onchange="accountStatus(${x.id},this.value)">${['À tester','Fonctionnel','Problème','Disponible','Désactivé','Expiré'].map(s=>`<option ${s===x.status?'selected':''} ${s==='Expiré'?'disabled':''}>${s}</option>`).join('')}</select></td><td>${x.expires_at?new Date(x.expires_at).toLocaleString('fr-FR'):'—'}</td><td>${x.days_left==null?'—':x.days_left<=0?'EXPIRÉ':x.days_left+' j.'}</td><td>${x.assigned_order_ref?'Attribué à '+esc(x.assigned_order_ref):'<b>Disponible</b>'}</td></tr>`).join('')||'<tr><td colspan="7">Aucun compte dans le stock.</td></tr>'}
async function addAccount(){try{const iso=v=>v?new Date(v).toISOString():null;await api('/api/admin/accounts',{method:'POST',body:JSON.stringify({service:svc.value,plan:plan.value,identifier:ident.value,secret:secret.value,status:astatus.value,startsAt:iso(start.value),expiresAt:iso(expiry.value),notes:anote.value})});stockMsg.textContent='Compte ajouté. Teste-le avant de le passer en Fonctionnel.';[svc,plan,ident,secret,start,expiry,anote].forEach(x=>x.value='');load()}catch(e){stockMsg.textContent=e.message}}
async function accountStatus(id,status){await api('/api/admin/accounts/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}
async function showTab(tab,btn){document.querySelectorAll('.admin-tabs .filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');ordersTab.style.display=tab==='orders'?'block':'none';stockTab.style.display=tab==='stock'?'block':'none'}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}function loginBox(){login.style.display='block';dash.style.display='none'}load();
</script></body></html>
