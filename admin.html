<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Next Digital CI</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="formwrap"><h1>Administration</h1><div id="login"><form id="loginForm"><label>E-mail<input name="email" type="email" required></label><label>Mot de passe<input name="password" type="password" required></label><button class="btn">Connexion</button></form><p id="err"></p></div><div id="panel" hidden><div id="stats" class="stats"></div><div id="orders"></div><button class="btn" onclick="logout()">Déconnexion</button></div></main>
<script>
async function load(){const r=await fetch('/api/admin/orders');if(r.status===401)return;const j=await r.json();document.getElementById('stats').innerHTML=`<b>${j.stats.total}</b> commandes · <b>${Number(j.stats.revenue).toLocaleString('fr-FR')} F</b> · <b>${j.stats.pending}</b> en attente`;document.getElementById('orders').innerHTML='<table><tr><th>Réf.</th><th>Client</th><th>Produit</th><th>Montant</th><th>Statut</th></tr>'+j.orders.map(o=>`<tr><td>${o.ref}</td><td>${o.customer_name}<br>${o.phone}</td><td>${o.product_name}</td><td>${o.amount.toLocaleString('fr-FR')}</td><td><select onchange="status(${o.id},this.value)">${['En attente','Confirmée','Livrée','Annulée'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')+'</table>';}
async function status(id,status){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load();}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload();}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok)return document.getElementById('err').textContent='Identifiants incorrects';document.getElementById('login').hidden=true;document.getElementById('panel').hidden=false;load();};
fetch('/api/admin/me').then(r=>{if(r.ok){document.getElementById('login').hidden=true;document.getElementById('panel').hidden=false;load();}});
</script></body></html>
