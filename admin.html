<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — Next Digital CI</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="nav"><a href="/" class="brand">NEXT <span>DIGITAL CI</span></a><button id="logout" class="btn">Déconnexion</button></header>
<main class="admin"><section id="login" class="panel small"><h1>Administration</h1><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Mot de passe"><button id="loginBtn" class="btn primary full">Se connecter</button><p id="loginMsg"></p></section>
<section id="app" hidden><div class="stats" id="stats"></div><div class="panel"><h2>Commandes</h2><div id="orders"></div></div><div class="panel"><h2>Stock des comptes</h2><form id="stockForm" class="grid"><input id="service" placeholder="Service" required><input id="plan" placeholder="Plan"><input id="identifier" placeholder="Identifiant" required><input id="secret" placeholder="Mot de passe"><select id="status"><option>À tester</option><option>Fonctionnel</option><option>Disponible</option><option>Problème</option><option>Désactivé</option><option>Expiré</option></select><input id="expiry" type="date"><button class="btn primary">Ajouter au stock</button></form><div id="stock"></div></div></section></main>
<script>
const $=s=>document.querySelector(s);
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('AUTH');if(!r.ok)throw new Error(d.error||'Erreur');return d}
async function load(){try{await api('/api/admin/me');$('#login').hidden=true;$('#app').hidden=false;const [st,orders,stock]=await Promise.all([api('/api/admin/stats'),api('/api/admin/orders'),api('/api/admin/accounts')]);$('#stats').innerHTML=`<div>Commandes<br><b>${st.orders}</b></div><div>En attente<br><b>${st.pending}</b></div><div>CA encaissé<br><b>${Number(st.revenue).toLocaleString('fr-FR')} F</b></div><div>Stock disponible<br><b>${st.available}</b></div>`;$('#orders').innerHTML=orders.length?orders.map(o=>`<div class="row"><b>${o.ref}</b><span>${o.customer_name}<br>${o.product} — ${Number(o.amount).toLocaleString('fr-FR')} F</span><span>${o.payment_status}<br>${o.status}</span><span>${o.account_identifier||'—'}</span></div>`).join(''):'Aucune commande';$('#stock').innerHTML=stock.length?stock.map(a=>`<div class="row"><b>#${a.id}</b><span>${a.service} — ${a.plan||''}<br>${a.identifier}</span><span>${a.status}</span><span>${a.expiry_date||'—'}</span></div>`).join(''):'Stock vide'}catch(e){if(e.message!=='AUTH')console.error(e)}}
$('#loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});load()}catch(e){$('#loginMsg').textContent=e.message}};
$('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()};
$('#stockForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:$('#service').value,plan:$('#plan').value,identifier:$('#identifier').value,secret:$('#secret').value,status:$('#status').value,expiry_date:$('#expiry').value||null})});e.target.reset();load()};
load();
</script></body></html>
